name: Build Samsung Galaxy A23 5G ResukiSU+SUSFS v2.2.0 (wonderful-fourteen)

on:
  workflow_dispatch:
  push:
    branches:
      - wonderful-fourteen

env:
  DEVICE_NAME: "samsung_a23xq"
  DEVICE_CODENAME: "a23xq"
  KERNEL_ARCH: "arm64"
  DEFCONFIG_NAME: "wonderful_defconfig"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-"
  EXTRA_CMDS: "LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-security-release/clang-r416183b1.tar.gz"
  GCC_URL: "https://github.com/rsuplaygrnd/toolchains.git"
  GCC_BRANCH: "androidcc-4.9"

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  AK3_COMMIT: "dca9dc370838d919d56c1f59ec78b27a14a72c68"

  ROM_TEXT: "wonderful_fourteen_resukisu_susfs220"

  PATCHES_BASE: "https://raw.githubusercontent.com/nevadamurdock/NonGKI_Kernel_Build_2nd/mainline"

  KERNELSU_AUTHOR: "ReSukiSU"
  KERNELSU_NAME: "ReSukiSU"
  KERNELSU_ORIGIN_BRANCH: "main"
  KERNELSU_BRANCH: "main"

  SUSFS_VERSION: "2.2.00"

jobs:
  build-kernel:
    name: Build A23 5G ResukiSU + SUSFS v2.2.0
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex bison gperf build-essential zip curl wget \
            zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev squashfs-tools schedtool dpkg-dev \
            liblz4-tool make optipng maven libssl-dev bc libc6-dev-i386 libx11-dev lib32z-dev \
            libgl1-mesa-dev xsltproc unzip device-tree-compiler cpio lz4 libz3-4 zstd \
            libelf-dev libncurses-dev p7zip p7zip-full python3
          curl -L -o libtinfo5.deb "https://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb"
          sudo apt-get install -y ./libtinfo5.deb
          rm -f libtinfo5.deb

      - name: Install mkdtimg tool
        run: |
          mkdir -p mkdtbo
          cd mkdtbo
          curl -L -o src.tar.gz "https://android.googlesource.com/platform/system/libufdt/+archive/refs/heads/main/utils/src.tar.gz"
          tar zxvf src.tar.gz
          chmod +x mkdtboimg.py
          sudo ln -sf "$(pwd)/mkdtboimg.py" /usr/bin/mkdtimg
          sudo ln -sf "$(pwd)/mkdtboimg.py" /usr/bin/mkdtboimg

      - name: Get Clang toolchain
        run: |
          curl -L -o clang.tar.gz "${{ env.CLANG_URL }}"
          mkdir -p clang-custom
          tar -C clang-custom -zxf clang.tar.gz
          SUB=$(find clang-custom -maxdepth 1 -type d -name 'clang-r*' | head -n 1)
          if [ -n "$SUB" ] && [ ! -d clang-custom/bin ]; then
            mv "$SUB"/* clang-custom/
            mv "$SUB"/.* clang-custom/ 2>/dev/null || true
          fi
          test -x clang-custom/bin/clang && echo "[+] Clang OK" || { echo "[-] clang binary missing"; exit 1; }

      - name: Get aarch64 GCC 4.9 (androidcc-4.9)
        run: |
          git clone --depth=1 "${{ env.GCC_URL }}" -b "${{ env.GCC_BRANCH }}" google
          if [ -x google/bin/aarch64-linux-android-ld ]; then
            echo "[+] aarch64 GCC 4.9 found"
          else
            echo "[-] aarch64 GCC 4.9 not found, abort."
            exit 1
          fi
          echo "GCC_64=CROSS_COMPILE=$GITHUB_WORKSPACE/google/bin/aarch64-linux-android-" >> $GITHUB_ENV

      - name: Get AnyKernel3
        run: |
          git clone "${{ env.AK3_SOURCE }}" -b "${{ env.AK3_BRANCH }}" Anykernel3
          cd Anykernel3
          git checkout ${{ env.AK3_COMMIT }}
          echo "[+] Anykernel3 ready."

      - name: Bersihkan KernelSU lama, pertahankan core SUSFS v2.2.0
        run: |
          rm -rf drivers/kernelsu KernelSU KernelSU-Next
          sed -i '/kernelsu/d' drivers/Makefile
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/CONFIG_KSU/d' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "[+] KernelSU lama dibersihkan, core SUSFS dipertahankan."

      - name: Install KernelSU (ResukiSU) fresh
        run: |
          curl -sSL "https://raw.githubusercontent.com/${KERNELSU_AUTHOR}/${KERNELSU_NAME}/refs/heads/${KERNELSU_ORIGIN_BRANCH}/kernel/setup.sh" | bash -s "${{ env.KERNELSU_BRANCH }}"

      - name: Set KSU + SUSFS defconfig
        run: |
          CFG=arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          sed -i '/CONFIG_KSU/d' $CFG
          sed -i '/CONFIG_KSU_SUSFS/d' $CFG
          cat <<'EOF' >> $CFG
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF
          if grep -q "THREAD_INFO_IN_TASK" drivers/kernelsu/Kconfig 2>/dev/null; then
            echo "CONFIG_THREAD_INFO_IN_TASK=y" >> $CFG
          fi
          echo "[+] KSU + SUSFS config appended."

      - name: Extra kernel config (KALLSYMS + localversion)
        run: |
          CFG=arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          sed -i 's|# CONFIG_LOCALVERSION is not set|CONFIG_LOCALVERSION="-ResukiSU"|' $CFG
          sed -i 's|# CONFIG_LOCALVERSION_AUTO is not set|CONFIG_LOCALVERSION_AUTO=n|' $CFG
          sed -i -e '/CONFIG_DEBUG_KERNEL/d' -e '/CONFIG_KALLSYMS/d' -e '/CONFIG_KALLSYMS_ALL/d' $CFG
          cat <<'EOF' >> $CFG
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF
          echo "[+] Kernel name -ResukiSU, KALLSYMS enabled."

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          key: build-kernel-${{ env.DEVICE_NAME }}
          max-size: 2G

      - name: Build kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang-custom/bin:$GITHUB_WORKSPACE/google/bin:$PATH
          make O=out ARCH=${{ env.KERNEL_ARCH }} ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} ${{ env.DEFCONFIG_NAME }}
          make -j$(nproc --all) CC="ccache clang" ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} O=out ARCH=${{ env.KERNEL_ARCH }} 2>&1 | tee error.log

      - name: Verify build output
        run: |
          ls -la out/arch/${{ env.KERNEL_ARCH }}/boot/
          test -f out/arch/${{ env.KERNEL_ARCH }}/boot/Image && echo "Image OK"

      - name: Create DTBO image
        run: |
          DTBO_FILES=$(find out/arch/${{ env.KERNEL_ARCH }}/boot/dts/ -name "*a23xq*.dtbo" 2>/dev/null)
          if [ -z "$DTBO_FILES" ]; then
            echo "[-] No .dtbo files found."
            find out/ -name "*.dtbo" | head -50
            exit 1
          fi
          mkdtimg create out/arch/${{ env.KERNEL_ARCH }}/boot/dtbo.img --page_size=4096 ${DTBO_FILES}
          echo "[+] DTBO created."

      - name: Pack AnyKernel3 zip
        run: |
          TIME=$(date +"%Y%m%d%H%M%S")
          IMAGE_DIR="out/arch/${{ env.KERNEL_ARCH }}/boot"
          mkdir -p tmp

          sed -i 's|ExampleKernel by osm0sis @ xda-developers|ResukiSU+SUSFS Kernel Build @ github|g' Anykernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh
          sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' Anykernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' Anykernel3/anykernel.sh

          if [ -f "$IMAGE_DIR/Image.gz-dtb" ]; then
            cp -fp $IMAGE_DIR/Image.gz-dtb tmp; echo "Image.gz-dtb"
          elif [ -f "$IMAGE_DIR/Image.gz" ]; then
            cp -fp $IMAGE_DIR/Image.gz tmp; echo "Image.gz"
          elif [ -f "$IMAGE_DIR/Image" ]; then
            cp -fp $IMAGE_DIR/Image tmp; echo "Image"
          fi

          if [ -f "$IMAGE_DIR/dtbo.img" ]; then
            cp -fp $IMAGE_DIR/dtbo.img tmp; echo "dtbo.img"
          fi

          if [ -f "$IMAGE_DIR/dtb.img" ]; then
            cp -fp $IMAGE_DIR/dtb.img tmp/dtb
          elif [ -f "$IMAGE_DIR/dtb" ]; then
            cp -fp $IMAGE_DIR/dtb tmp
          fi

          cp -rp ./Anykernel3/* tmp
          cd tmp
          7za a -mx9 tmp.zip * >/dev/null
          cd ..
          cp -fp tmp/tmp.zip "${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-Anykernel3.zip"
          rm -rf tmp
          echo "PACK_NAME=${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-Anykernel3.zip" >> $GITHUB_ENV
          echo "[+] Pack done: ${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-Anykernel3.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ env.PACK_NAME }}
          path: ${{ env.PACK_NAME }}
